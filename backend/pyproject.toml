[project]
name = "stock-analysis"
version = "0.1.0"
description = "ML-powered stock analysis platform with sentiment analysis"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    # Data fetching
    "yfinance>=0.2.40",
    "fredapi>=0.5.0",
    "finvizfinance>=0.14.0",
    "newsapi-python>=0.2.7",
    "praw>=7.7.0",
    # ML
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "torch>=2.3.0",
    # Data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # HTTP client
    "httpx>=0.27.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Utils
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
