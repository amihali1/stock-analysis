services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://stockuser:stockpass@postgres:5432/stock_analysis
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Durable model storage. Models used to be baked into the image, so
      # every rebuild reverted the container to whatever the host dir held —
      # the 5/18 v7 promotion (docker cp, container-only) was silently lost
      # this way, and the 7/5 scheduled retrain would have been too. The bind
      # mount makes promotions and retrains persist across rebuilds; the
      # image's baked copy is shadowed and serves only as a first-boot seed.
      - ./trained_models:/app/trained_models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://10.0.0.47:8000
    ports:
      - "3100:3100"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=stockuser
      - POSTGRES_PASSWORD=stockpass
      - POSTGRES_DB=stock_analysis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-local only. The backend reaches postgres over the docker network;
      # publishing on 0.0.0.0 exposed the DB (dev creds) to the whole LAN
      # (audit 2026-07-14). 127.0.0.1 keeps host-side psql/debug working.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockuser -d stock_analysis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
